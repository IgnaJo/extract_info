name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --junitxml=junit.xml

      - name: Annotate test failures
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("junit.xml")
          if not report.exists():
              print("::error::pytest no generó junit.xml")
          else:
              for case in ET.parse(report).iter("testcase"):
                  for node in case.findall("failure") + case.findall("error"):
                      first_line = (node.get("message") or "").splitlines()[0][:500]
                      where = case.get("file") or case.get("classname") or ""
                      print(
                          f"::error file={where}::"
                          f"{case.get('classname')}.{case.get('name')}: {first_line}"
                      )

      - name: Build executable
        run: pyinstaller extract_info.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extract_info-windows
          path: dist/extract_info.exe
          if-no-files-found: error
          retention-days: 30
